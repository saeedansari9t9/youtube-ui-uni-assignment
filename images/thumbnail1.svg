<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg1)"/>
  
  <!-- Subtle Grid/Pattern -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>

  <!-- Glowing Accents -->
  <circle cx="520" cy="180" r="140" fill="#3b82f6" opacity="0.3" filter="blur(40px)"/>
  <circle cx="200" cy="280" r="100" fill="#ec4899" opacity="0.25" filter="blur(30px)"/>

  <!-- Code Window Mockup -->
  <g transform="translate(320, 50)">
    <rect width="280" height="200" rx="12" fill="#1e293b" opacity="0.95" stroke="#334155" stroke-width="2"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    
    <rect x="20" y="45" width="90" height="10" rx="3" fill="#38bdf8"/>
    <rect x="120" y="45" width="60" height="10" rx="3" fill="#a855f7"/>
    
    <rect x="40" y="70" width="140" height="10" rx="3" fill="#f43f5e"/>
    <rect x="40" y="95" width="100" height="10" rx="3" fill="#4ade80"/>
    <rect x="40" y="120" width="160" height="10" rx="3" fill="#fbbf24"/>
    <rect x="60" y="145" width="80" height="10" rx="3" fill="#38bdf8"/>
    <rect x="20" y="170" width="40" height="10" rx="3" fill="#94a3b8"/>
  </g>

  <!-- Big Badge / Labels -->
  <rect x="35" y="45" width="140" height="34" rx="6" fill="#f59e0b"/>
  <text x="105" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#000" text-anchor="middle">2026 EDITION</text>

  <!-- Main Headline -->
  <text x="35" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="-0.5">FULL-STACK</text>
  <text x="35" y="178" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#glow1)" letter-spacing="-0.5">WEB DEV</text>
  <text x="35" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#e2e8f0">BOOTCAMP</text>

  <!-- Tech tags -->
  <g transform="translate(35, 260)">
    <rect width="70" height="28" rx="14" fill="#e34c26"/>
    <text x="35" y="19" font-family="sans-serif" font-weight="bold" font-size="12" fill="#fff" text-anchor="middle">HTML5</text>
    
    <rect x="80" y="0" width="65" height="28" rx="14" fill="#264de4"/>
    <text x="112" y="19" font-family="sans-serif" font-weight="bold" font-size="12" fill="#fff" text-anchor="middle">CSS3</text>

    <rect x="155" y="0" width="90" height="28" rx="14" fill="#f7df1e"/>
    <text x="200" y="19" font-family="sans-serif" font-weight="bold" font-size="12" fill="#000" text-anchor="middle">JAVASCRIPT</text>
  </g>

  <!-- Duration Badge -->
  <rect x="560" y="320" width="65" height="26" rx="4" fill="#000000" opacity="0.85"/>
  <text x="592" y="338" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">4:15:20</text>
</svg>
